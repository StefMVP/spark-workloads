name: jobs-studio
title: Container jobs on spark1, spark2 and spark4; Imagination Studio on spark3 only
switch:
  lab: true
  layout: 1,2,3,4
  groups:
    s1: [spark1]
    s2: [spark2]
    s3: [spark3]
    s4: [spark4]
  reservations:
    s1:
      by: jobs
      for: container jobs
    s2:
      by: jobs
      for: container jobs
    s4:
      by: jobs
      for: container jobs
  images:
    spark1: spark-workload:local
    spark2: spark-workload:local
    spark4: spark-workload:local
  studio:
    default: 1
    workers:
      spark1: false
      spark2: false
      spark4: false
  default: null
  instances: []
